services:
  backend:
    build: ./backend
    container_name: campero_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=True

  frontend:
    build: ./campero-frontend
    container_name: campero_frontend
    ports:
      - "4200:4200"
    volumes:
      - ./campero-frontend:/app
      - /app/node_modules
    depends_on:
      - backend